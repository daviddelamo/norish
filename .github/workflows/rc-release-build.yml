name: RC Release Build and Publish Docker

on:
  push:
    branches:
      - "rc/**"

# Scoped per branch: a single shared "release-rc" group meant two rc/* branches
# cancelled each other's releases, leaving the loser's head commit showing a
# cancelled quality check on its PR.
concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # Needed to export the BuildKit layer cache to GHCR. The image itself still
  # publishes to Docker Hub under DOCKERHUB_* credentials, not this token.
  packages: write

jobs:
  # The tag and the publish below both hang off this job, so nothing ships
  # without it going green.
  quality:
    name: Quality
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit

  # The Compose examples this release ships name one exact Obscura image. Prove
  # it is published, on both architectures, before tagging a release that tells
  # operators to pull it.
  obscura-pin:
    name: Obscura pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: ./tooling/github/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Verify the pinned Obscura image
        run: ./docker/obscura/verify-pin.sh --registry

  prepare-release:
    name: Create RC tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, obscura-pin]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tag computation only needs Node itself, not the workspace install.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Create RC tag
        id: tag
        uses: ./tooling/github/tag-release
        with:
          tag-prefix: rc-v
          require-beta: "true"

  docker-publish:
    name: Publish
    uses: ./.github/workflows/_docker-build.yml
    needs: prepare-release
    secrets: inherit
    with:
      push: true
      primary-image: docker.io/norishapp/norish
      tags: ${{ needs.prepare-release.outputs.tag }}
