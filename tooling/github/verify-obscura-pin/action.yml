name: "Verify Obscura pin"
description: >-
  Prove the Obscura image a release points at is published for both
  architectures, and that every active surface names that exact tag.

inputs:
  dockerhub-username:
    description: "Docker Hub username."
    required: true
  dockerhub-password:
    description: "Docker Hub password."
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Authenticated so a rate-limited anonymous pull cannot read as "the tag is
    # not there" and fail a release for the wrong reason.
    - name: Login to container registry
      uses: ./tooling/github/registry-login
      with:
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-password: ${{ inputs.dockerhub-password }}

    - name: Verify the pinned Obscura image
      shell: bash
      run: ./docker/obscura/verify-pin.sh --registry
